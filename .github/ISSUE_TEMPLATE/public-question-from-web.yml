name: 提交网页中已经填写的题目
description: 题目、分类和难度已由网站带入，确认后直接发布到统一题库
title: "[新增题目] "
labels: ["public-question"]
body:
  - type: markdown
    attributes:
      value: |
        这是“公开”题目的最后提交页。下面的题目、分类和难度已经由网站带入，不需要重新选择。点击提交后，这条 Issue 会立即作为公开题目显示在统一题库中，不经过人工审核或二次收录；GitHub 用户名、Issue 和题目内容都会公开。

  - type: textarea
    id: details
    attributes:
      label: 已从网站带入的题目内容
      description: 请检查内容是否正确即可；分类和难度已经包含在这里。
      placeholder: 请先回到网站的“增加题目”页面填写，选择“公开”后再来到这里确认。
    validations:
      required: true

  - type: checkboxes
    id: compliance
    attributes:
      label: 最终公开确认
      options:
        - label: 我明白题目和 GitHub 用户名提交后会公开到统一题库，并确认已经移除个人隐私、公司机密、内部题库和 NDA 内容，也有权公开这道题。
          required: true

name: 准备公开题目标签

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: question-collaboration-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  labels:
    name: 创建公开题目标签
    runs-on: ubuntu-latest
    steps:
      - name: 确保标签存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create public-question --color 0e8a16 --description "提交后直接显示在题库中的公开题目" --force
